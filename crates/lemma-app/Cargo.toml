[package]
name = "lemma-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "lemma"
path = "src/main.rs"

[dependencies]
lemma-core = { workspace = true }
lemma-syntax = { workspace = true }
lemma-snippets = { workspace = true }
lemma-complete = { workspace = true }
lemma-review = { workspace = true }
lemma-build = { workspace = true }
lemma-pdf = { workspace = true }
lemma-agent = { workspace = true }
lemma-config = { workspace = true }
# M3 (WP3.3 and WP3.6)
lemma-preview = { workspace = true }
lemma-search = { workspace = true }
gtk = { workspace = true }
gdk = { workspace = true }
adw = { workspace = true }
sourceview5 = { workspace = true }
libspelling = { workspace = true }
glib = { workspace = true }
gio = { workspace = true }
pango = { workspace = true }
cairo = { workspace = true }
async-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# M2: render_page (poppler on a jobs thread), local history (zstd objects), fuzzy file mentions
poppler = { workspace = true }
ruzstd = { workspace = true }
frizbee = { workspace = true }
# M3 (WP3.8): the git gutter's line diff
similar = { workspace = true }
# M5 (WP5.5): BibTeX import from doi.org and the arXiv API, only on the user's action
ureq = { workspace = true }
# M5 review: latexindent's private working directory (format.rs)
tempfile = { workspace = true }

