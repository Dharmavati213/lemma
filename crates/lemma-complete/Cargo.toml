[package]
name = "lemma-complete"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The tables are generated by `cargo run -p xtask -- gen-completion`: the core packages as static
# data (src/generated.rs), every other package as a zstd frame of src/packages.zst, decompressed
# with ruzstd (already in the app for local history) when a project loads it.
[dependencies]
lemma-syntax = { workspace = true }
lemma-snippets = { workspace = true }
frizbee = { workspace = true }
ruzstd = { workspace = true }
