line_begin = true
priority = 2000
description = "figure"

# ───────────── Sections: manual ─────────────

[[snippet]]
trigger = "sec"
body = '''
\section{$1}\label{sec:$2}
$0'''
description = "\\section + \\label"

[[snippet]]
trigger = "sub"
body = '''
\subsection{$1}\label{sub:$2}
$0'''
description = "\\subsection + \\label"

[[snippet]]
trigger = "ssub"
body = '''
\subsubsection{$1}\label{ssub:$2}
$0'''
description = "\\subsubsection + \\label"

# ───────────── Text mode: automatic ─────────────

[[snippet]]
trigger = "mk"
body = '${$}$1${$}$0'
auto = true
context = "text"
description = "inline math $…$"

[[snippet]]
trigger = "dm"
body = '''
\[
  $1
\]
$0'''
auto = true
context = "text"
description = "display math \\[ … \\]"

