# Lemma default snippets, curated from a LuaSnip set.
#
# Body syntax: $N / ${N} / ${N:default} are tab stops (N = 0..9, $0 = final cursor),
# a repeated N is a mirror, ${$} is a literal dollar, any other '$' is literal,
# backslashes are literal (use TOML literal strings: '...' / '''...''').
#
# Fields: trigger, body, auto (default false), context = "any" | "math" | "text" (default "any"),
#         word_trig (default true: the trigger must not be preceded by a letter/digit/underscore),
#         line_begin (default false: only whitespace may precede the trigger on the line),
#         priority (default 0), description, if_undefined.
# if_undefined: the body is a single control sequence (e.g. '\N'); when the project does not
#               define it (\newcommand, \DeclareMathOperator, \def, ...), this body is used instead.
#
# Every "math" snippet also requires that the character before the trigger is not '\',
# so typing \sum, \hat, \int, \set... never expands anything.
#
# Override or add snippets in ~/.config/lemma/snippets.toml (same format).

# ───────────── Environments: manual (Tab or completion), at the start of a line ─────────────
# Theorem-like: cursor first lands right after \begin{..} (type [Title] or press Tab), then in the body.
# Other theorem-like environments declared with \newtheorem in the project are offered by completion.

[[snippet]]
trigger = "thm"
body = '''
\begin{theorem}$1
  $0
\end{theorem}'''
line_begin = true
priority = 2000
description = "theorem"

