# Builds Lemma.app and its DMG on Apple silicon, starts the app with Homebrew moved aside and
# snapshots its window (packaging/macos/). The DMG and the snapshots are the run's artifact
# Lemma-macos-arm64. release.yml calls this workflow for a release (release-tag names the DMG
# Lemma-<tag>-macos-arm64.dmg) and publishes the DMG. The tests run on Linux (scripts/ci.sh).
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The release's tag, which names the DMG Lemma-<tag>-macos-arm64.dmg
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lemma.app (arm64)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Homebrew dependencies
        run: brew install gtk4 libadwaita gtksourceview5 libspelling poppler adwaita-icon-theme librsvg pkgconf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Lemma.app and the DMG
        env:
          LEMMA_DMG_NAME: ${{ inputs.release-tag && format('Lemma-{0}-macos-arm64', inputs.release-tag) || '' }}
        run: packaging/macos/bundle.sh

      - name: Start the app without Homebrew
        run: packaging/macos/smoke-test.sh dist/Lemma.app dist/smoke

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Lemma-macos-arm64
          path: |
            dist/*.dmg
            dist/smoke/
          if-no-files-found: warn

